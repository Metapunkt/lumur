[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumur"
version = "0.1.0"
description = "Lumur Python companion: structured-light calibration, scan, tracking, and ComfyUI generation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
pose = ["mediapipe>=0.10"]
yolo = ["ultralytics>=8.0"]

[project.scripts]
lumur-calibrate = "lumur.cli:main"
lumur-scan = "lumur.cli_scan:main"
lumur-export-godot = "lumur.cli_export_godot:main"
lumur-track = "lumur.cli_track:main"
lumur-generate = "lumur.cli_generate:main"

[tool.setuptools.packages.find]
include = ["lumur*"]

[tool.setuptools.package-data]
lumur = ["sim/presets/*.json", "presets/workflows/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"