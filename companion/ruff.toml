# Light lint config for Lumur companion CI — catch real bugs, not style churn.
line-length = 100
target-version = "py310"

[lint]
# F: pyflakes (undefined names, unused imports). E9: runtime syntax errors.
select = ["F", "E9"]
ignore = [
  "F841",  # unused locals — often intentional leftovers in demos/tests
]

[lint.per-file-ignores]
"tests/*" = ["E402"]
